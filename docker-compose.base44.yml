services:
  api:
    image: node:22-slim
    container_name: hiker-erp-api
    working_dir: /app
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
      - api_data:/app/data
    environment:
      - PORT=4000
      - DB_PATH=/app/data/hiker-shoes.db
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec node --watch server.js"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 240s

  web:
    image: node:22-alpine
    container_name: hiker-erp-web
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_PROXY_TARGET=http://api:4000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  api_node_modules:
  api_data:
  web_node_modules:
