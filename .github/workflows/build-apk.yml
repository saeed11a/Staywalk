name: Build Android .apk

on:
  workflow_dispatch:
  push:
    branches: [apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare Capacitor
        run: |
          mkdir -p build-apk
          cd build-apk

          npm init -y >/dev/null

          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund

          node -e "const fs=require('fs');const cfg={appId:'com.hikererp.app',appName:'Hiker ERP',webDir:'www'};fs.writeFileSync('capacitor.config.json',JSON.stringify(cfg,null,2))"

          cp -r ../frontend/dist ./www

          npx cap add android

      - name: Build APK
        working-directory: build-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hiker-erp-android-apk
          path: build-apk/android/app/build/outputs/apk/debug/*.apk
